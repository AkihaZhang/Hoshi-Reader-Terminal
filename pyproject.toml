[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoshi-reader-terminal"
version = "0.1.17"
description = "A terminal Japanese reader with bookshelf, dictionary lookup, Anki card creation, and Sasayaki audiobook support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Hoshi Reader Terminal contributors" }]
keywords = ["epub", "reader", "terminal", "japanese", "yomitan", "parody"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Topic :: Text Processing",
]

[project.scripts]
hoshi = "hoshi_terminal.cli:main"
hoshi-terminal = "hoshi_terminal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hoshi_terminal*"]
